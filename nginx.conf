server {
    listen 80;
    server_name localhost;
    client_max_body_size 100M;

    # Frontend/API Proxy
    location / {
        proxy_pass http://iptv-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;

        add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:; connect-src *;" always;
    }

    # Enhanced CORS Proxy
    location ~* ^/proxy/(https?):?/?/+([^/]+)(/.*)?$ {
        set $protocol $1;
        set $target_host $2;
        set $path_args $3;

        resolver 8.8.8.8 1.1.1.1 valid=30s;
        resolver_timeout 5s;

        proxy_pass $protocol://$target_host$path_args$is_args$args;

        absolute_redirect off;
        proxy_redirect ~^(https?://.*)$ /proxy/$1;
        proxy_redirect ~^/(.*)$ /proxy/$protocol://$target_host/$1;

        proxy_ssl_server_name on;
        proxy_ssl_name $target_host;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Range,Authorization,Content-Type,User-Agent' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Forward the User-Agent provided in the 'ua' query parameter.
        # This avoids CORS preflight issues that occur with custom headers.
        set $custom_ua $arg_ua;
        if ($custom_ua = "") {
            # Default to Apple TV if no custom UA is provided via query param
            set $custom_ua "AppleCoreMedia/1.0.0.19K362 (Apple TV; U; CPU OS 15_4 like Mac OS X; en_us)";
        }
        proxy_set_header User-Agent $custom_ua;
        proxy_set_header Host $target_host;
        proxy_set_header Referer "";
        proxy_set_header Origin "";
        proxy_hide_header 'Access-Control-Allow-Origin';
    }
}