# ─── Upstream: Node app connection pool ──────────────────────────────────────
upstream iptv_backend {
    server iptv-app:3000;
    keepalive 32;
}

server {
    listen 80;
    listen 443 ssl;
    server_name localhost;
    client_max_body_size 100M;

    # SSL Configuration
    # Ensure you mount your certificates to /etc/nginx/ssl/ in docker-compose.yml
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Global HTTPS Enforcement
    if ($scheme != "https") {
        return 301 https://$host$request_uri;
    }

    # ── TCP optimisations ────────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout      70;
    keepalive_requests    1000;

    # ─────────────────────────────────────────────────────────────────────────
    # SECTION 1 — Frontend / API (non-streaming)
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass          http://iptv_backend;
        proxy_http_version  1.1;
        proxy_set_header Connection         "";   # keepalive to backend
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header Upgrade            $http_upgrade;

        proxy_connect_timeout   10s;
        proxy_send_timeout      30s;
        proxy_read_timeout      30s;

        add_header Content-Security-Policy "default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:; connect-src *;" always;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # SECTION 2 — CORS / stream proxy
    # ─────────────────────────────────────────────────────────────────────────
    location ~* ^/proxy/(https?):?/?/+([^/]+)(/.*)?$ {
        set $protocol    $1;
        set $target_host $2;
        set $path_args   $3;

        # ── DNS ──────────────────────────────────────────────────────────────
        resolver 8.8.8.8 1.1.1.1 valid=10s ipv6=off;
        resolver_timeout 3s;

        proxy_pass $protocol://$target_host$path_args$is_args$args;

        # ── Connection ───────────────────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header   Connection "";   # keepalive to origin

        # ── Redirect rewriting ───────────────────────────────────────────────
        absolute_redirect off;
        proxy_redirect ~^(https?://.*)$  /proxy/$1;
        proxy_redirect ~^/(.*)$          /proxy/$protocol://$target_host/$1;

        # ── TLS ──────────────────────────────────────────────────────────────
        proxy_ssl_server_name on;
        proxy_ssl_name        $target_host;
        proxy_ssl_protocols   TLSv1.2 TLSv1.3;
        proxy_ssl_verify      off;

        # ── Request headers forwarded upstream ───────────────────────────────
        set $custom_ua $arg_ua;
        if ($custom_ua = "") {
            set $custom_ua "AppleCoreMedia/1.0.0.19K362 (Apple TV; U; CPU OS 15_4 like Mac OS X; en_us)";
        }
        proxy_set_header User-Agent  $custom_ua;
        proxy_set_header Host        $target_host;
        proxy_set_header Referer     "";
        proxy_set_header Origin      "";

        # Pass byte-range headers through — essential for DASH init segments
        # and DRM licence partial-content responses.
        proxy_set_header Range    $http_range;
        proxy_set_header If-Range $http_if_range;

        # ── Response body / Content-Type ─────────────────────────────────────
        # IMPORTANT: do NOT use add_header Content-Type inside if{} blocks here.
        # nginx's "if is evil" rule means any add_header inside an if{} block
        # silently drops ALL add_header directives from the enclosing location,
        # which would wipe out the CORS headers below and break DRM licence
        # requests (which require Access-Control-Allow-Origin).
        #
        # Instead, pass the Content-Type from the origin unchanged.  IPTV
        # servers and CDNs virtually always send the correct type; Shaka Player
        # has its own sniffing fallback when they don't.
        proxy_pass_header Content-Type;

        # ── Buffering — Aggressive for far/unstable servers ──────────────────
        # Larger RAM buffers help survive significant network jitter.
        proxy_buffering         on;
        proxy_buffer_size       256k;
        proxy_buffers           32 256k;       # 8MB total RAM buffer
        proxy_busy_buffers_size 1024k;
        proxy_max_temp_file_size 0;           # Disable disk buffering (RAM only)
        proxy_request_buffering off;

        # ── Timeouts ─────────────────────────────────────────────────────────
        proxy_connect_timeout   10s;
        proxy_send_timeout     120s;
        proxy_read_timeout     120s;

        # ── CORS headers ─────────────────────────────────────────────────────
        # These are set UNCONDITIONALLY in the location block (no if{} wrappers)
        # so they are applied to every response: manifests, segments, DRM licences.
        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin'   '*'                                           always;
        add_header 'Access-Control-Allow-Methods'  'GET, POST, OPTIONS'                          always;
        add_header 'Access-Control-Allow-Headers'  'Range,Authorization,Content-Type,User-Agent' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range'                always;

        # ── OPTIONS preflight ────────────────────────────────────────────────
        # NOTE: the if{} here contains only return, not add_header, so it is
        # safe — nginx's header inheritance only breaks when add_header is
        # mixed inside if{} alongside add_header in the parent block.
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin'  '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Range,Authorization,Content-Type,User-Agent' always;
            add_header 'Content-Length' 0;
            return 204;
        }
    }
}