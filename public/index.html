<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:; connect-src *;">
    <title>Streamline IPTV</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/7.0.2/mux.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            grid-template-rows: 70px 1fr;
            height: 100vh;
        }

        header {
            grid-column: 1 / -1;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
        }

        .player-area {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .menu-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 240;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        .menu-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }

        .mobile-sliding-menu {
            position: fixed;
            top: 0;
            right: -280px;
            width: 280px;
            height: 100vh;
            background: var(--card-bg);
            z-index: 250;
            padding: 30px 25px;
            box-sizing: border-box;
            /* box-shadow: -10px 0 30px rgba(0, 0, 0, 0.5); */
            display: flex;
            flex-direction: column;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .mobile-sliding-menu.active {
            right: 0;
        }

        .menu-close-btn {
            align-self: flex-end;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.8rem;
            cursor: pointer;
            margin-bottom: 30px;
        }

        .header-toggle-btn {
            display: none; /* Hidden by default on desktop */
        }

        .mobile-only-btn {
            display: none;
        }

        .now-playing-overlay {
            position: absolute;
            bottom: 100px;
            left: 50px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 55;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .now-playing-logo {
            width: 48px;
            height: 48px;
            object-fit: contain;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
        }

        .player-area:hover .now-playing-overlay {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .now-playing-label {
            font-size: 0.6rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: 1.5px;
            display: block;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        #nowPlayingName {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 700;
            color: white;
        }

        #nowPlayingCat {
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .video-wrapper div[data-shaka-player-container] {
            width: 100% !important;
            height: 100% !important;
        }

        video#video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sidebar {
            background: var(--card-bg);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-controls {
            padding: 20px;
            background: rgba(30, 41, 59, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-select {
            width: 100%;
            background: var(--bg-dark);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        .search-container {
            position: relative;
            margin-bottom: 10px;
        }

        #channelSearch {
            padding-right: 40px;
            margin-bottom: 0;
        }

        .clear-search-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            color: var(--text-dim);
            cursor: pointer;
            font-size: 1.1rem;
            display: none;
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
            z-index: 10;
        }

        .clear-search-btn:hover {
            color: white;
        }

        #playlist {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 20px;
            list-style: none;
            margin: 0;
        }

        #playlist::-webkit-scrollbar {
            width: 5px;
        }

        #playlist::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .channel-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .channel-card:hover {
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        .channel-logo {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            background: var(--bg-dark);
            object-fit: contain;
            margin-right: 15px;
            padding: 5px;
        }

        .channel-meta {
            flex-grow: 1;
            min-width: 0;
        }

        .channel-name {
            display: block;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-cat {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .error-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            text-align: center;
        }

        .btn-retry {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
        }

        @media (max-width: 1100px) {
            body {
                overflow-y: auto;
            }

            .app-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .player-area {
                padding: 0;
                height: auto;
                display: flex;
                flex-direction: column;
            }

            .video-wrapper {
                border-radius: 0;
                height: auto;
                aspect-ratio: 16 / 9;
            }

            .now-playing-overlay {
                position: static;
                opacity: 1;
                transform: none;
                background: var(--card-bg);
                border: none;
                border-radius: 0;
                width: 100%;
                box-sizing: border-box;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                padding: 15px 20px;
                pointer-events: auto;
            }

            .mobile-only-btn {
                display: block;
                background: var(--primary);
                color: white;
                border: none;
                padding: 8px 16px;
                border-radius: 8px;
                font-weight: 600;
                cursor: pointer;
                font-size: 0.85rem;
                margin: 0;
                margin-left: auto;
            }

            /* Header specific mobile styles */
            #headerUserActions {
                display: none !important;
            }

            .header-toggle-btn {
                display: block;
                margin-left: auto;
            }

            header {
                position: relative; /* For absolute positioning of the mobile user menu */
            }

            .header-toggle-btn {
                display: block; /* Show on mobile */
                background: transparent;
                color: var(--text-main);
                border: none;
                padding: 5px 10px;
                font-size: 1.5rem;
                cursor: pointer;
                margin-left: auto; /* Push to the right */
            }

            .logo {
                font-size: 1.2rem;
            }

            .sidebar {
                display: flex;
                height: auto;
                max-height: 0;
                opacity: 0;
                overflow: hidden;
                transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
            }

            .sidebar.active {
                max-height: 80vh;
                opacity: 1;
            }

            #currentUserDisplay {
                display: none;
            }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="app-container" id="playerUI">
        <header>
            <div class="logo">STREAMLINE.</div>
            <div id="headerUserActions" style="display: flex; gap: 15px; align-items: center;">
                <span id="currentUserDisplay"
                    style="color: var(--text-main); font-size: 0.95rem; font-weight: 600; margin-right: 10px;"></span>

                <a href="/admin.html" id="adminLink"
                    style="display: none; background: rgba(14, 165, 233, 0.15); color: #0ea5e9; border: none; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: background 0.2s;">Admin
                    Panel</a>

                <button onclick="logout()"
                    style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Logout</button>
            </div>
            <button class="header-toggle-btn" onclick="toggleHeaderMenu()">☰</button>

            <div id="menuBackdrop" class="menu-backdrop" onclick="toggleHeaderMenu()"></div>

            <div id="mobileSlidingMenu" class="mobile-sliding-menu">
                <button class="menu-close-btn" onclick="toggleHeaderMenu()">✕</button>
                <span id="mobileUserDisplay" style="color: var(--text-dim); font-size: 0.9rem; margin-bottom: 25px; display: block; font-weight: 600;"></span>
                <div style="display: flex; flex-direction: column; gap: 15px;">
                    <a href="/admin.html" id="mobileAdminLink" style="display: none; background: rgba(14, 165, 233, 0.15); color: #0ea5e9; border: none; padding: 12px; border-radius: 8px; text-decoration: none; font-size: 1rem; font-weight: 600; text-align: center;">Admin Panel</a>
                    <button onclick="logout()" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 1rem;">Logout</button>
                </div>
            </div>
        </header>

        <main class="player-area">
            <div class="video-wrapper">
                <div data-shaka-player-container>
                    <video data-shaka-player id="video" autoplay></video>
                </div>
                <div id="unmuteHint" onclick="unmuteVideo()" style="display:none; position:absolute; top:20px; right:20px; background:rgba(59, 130, 246, 0.9); color:white; padding:10px 20px; border-radius:30px; cursor:pointer; z-index:60; font-weight:600; box-shadow:0 4px 15px rgba(0,0,0,0.3); align-items:center; gap:8px;">
                    <span>🔈 Click to Unmute</span>
                </div>
                <div id="videoErrorOverlay" class="error-overlay">
                    <h3 id="errorTitle" style="margin:0;">Playback Error</h3>
                    <p id="errorDescription" style="color:var(--text-dim);"></p>
                    <button class="btn-retry" onclick="retryLastChannel()">Retry Connection</button>
                </div>
            </div>
            <div id="nowPlayingOverlay" class="now-playing-overlay">
                <img id="nowPlayingLogo" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="now-playing-logo" alt="Channel Logo" onerror="this.onerror=null;this.src='https://via.placeholder.com/54/1e293b/ffffff?text=TV';">
                <div>
                    <span class="now-playing-label">Now Playing</span>
                    <h2 id="nowPlayingName">Channel Name</h2>
                    <span id="nowPlayingCat">Category</span>
                </div>
                <button id="mobileMenuBtn" class="mobile-only-btn" onclick="toggleSidebar()">☰ Channels</button>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-controls">
                <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; display: block;">Select Playlist</label>
                <select id="playlistSelector" class="filter-select" onchange="switchPlaylist()" style="margin-bottom: 10px;"></select>

                <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; display: block;">Search</label>
                <div class="search-container">
                    <input type="text" id="channelSearch" class="filter-select" placeholder="Find a channel..." oninput="filterChannels()" style="cursor: text;" autocomplete="off" spellcheck="false">
                    <button id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()">✕</button>
                </div>
                
                <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; display: block;">Category</label>
                <select id="categoryFilter" class="filter-select" onchange="filterChannels()"></select>
            </div>
            <ul id="playlist"></ul>
        </aside>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">Welcome Back</h2>
            <p style="color: var(--text-dim); margin-bottom: 25px;">Please sign in</p>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button class="btn-primary" onclick="submitLogin()">Sign In</button>
            <p id="loginResult" style="color: #ef4444; font-size: 0.85rem; margin-top: 15px;"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
