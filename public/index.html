<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src * 'unsafe-inline' 'unsafe-eval' data: blob:; script-src * 'unsafe-inline' 'unsafe-eval'; style-src * 'unsafe-inline'; img-src * data: blob:; media-src * blob: data:; connect-src *;">
    <title>Streamline IPTV</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/mux.js/7.0.2/mux.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.ui.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/controls.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #3b82f6;
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
        }

        .app-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            grid-template-rows: 70px 1fr;
            height: 100vh;
        }

        header {
            grid-column: 1 / -1;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            letter-spacing: -1px;
        }

        .player-area {
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            position: relative;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .video-wrapper div[data-shaka-player-container] {
            width: 100% !important;
            height: 100% !important;
        }

        video#video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .sidebar {
            background: var(--card-bg);
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-controls {
            padding: 20px;
            background: rgba(30, 41, 59, 0.5);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .filter-select {
            width: 100%;
            background: var(--bg-dark);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        #playlist {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px 20px;
            list-style: none;
            margin: 0;
        }

        #playlist::-webkit-scrollbar {
            width: 5px;
        }

        #playlist::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .channel-card {
            display: flex;
            align-items: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .channel-card:hover {
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        .channel-logo {
            width: 54px;
            height: 54px;
            border-radius: 8px;
            background: var(--bg-dark);
            object-fit: contain;
            margin-right: 15px;
            padding: 5px;
        }

        .channel-meta {
            flex-grow: 1;
            min-width: 0;
        }

        .channel-name {
            display: block;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .channel-cat {
            font-size: 0.75rem;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-top: 4px;
        }

        .error-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            z-index: 50;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            text-align: center;
        }

        .btn-retry {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 15px;
        }

        @media (max-width: 1100px) {
            body {
                overflow-y: auto;
            }

            .app-container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .player-area {
                padding: 0;
                height: 35vh;
            }

            .video-wrapper {
                border-radius: 0;
            }

            .sidebar {
                height: 600px;
            }
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 200;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            width: 100%;
            max-width: 360px;
            text-align: center;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            font-weight: 600;
            cursor: pointer;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <div class="app-container" id="playerUI">
        <header>
            <div class="logo">STREAMLINE.</div>
            <div style="display: flex; gap: 15px; align-items: center;">
                <span id="currentUserDisplay"
                    style="color: var(--text-main); font-size: 0.95rem; font-weight: 600; margin-right: 10px;"></span>

                <a href="/admin.html" id="adminLink"
                    style="display: none; background: rgba(14, 165, 233, 0.15); color: #0ea5e9; border: none; padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: background 0.2s;">Admin
                    Panel</a>

                <button onclick="logout()"
                    style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600;">Logout</button>
            </div>
        </header>

        <main class="player-area">
            <div class="video-wrapper">
                <div data-shaka-player-container>
                    <video data-shaka-player id="video" autoplay></video>
                </div>
                <div id="unmuteHint" onclick="unmuteVideo()" style="display:none; position:absolute; top:20px; right:20px; background:rgba(59, 130, 246, 0.9); color:white; padding:10px 20px; border-radius:30px; cursor:pointer; z-index:60; font-weight:600; box-shadow:0 4px 15px rgba(0,0,0,0.3); align-items:center; gap:8px;">
                    <span>🔈 Click to Unmute</span>
                </div>
                <div id="videoErrorOverlay" class="error-overlay">
                    <h3 id="errorTitle" style="margin:0;">Playback Error</h3>
                    <p id="errorDescription" style="color:var(--text-dim);"></p>
                    <button class="btn-retry" onclick="retryLastChannel()">Retry Connection</button>
                </div>
            </div>
        </main>

        <aside class="sidebar">
            <div class="sidebar-controls">
                <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; display: block;">Select Playlist</label>
                <select id="playlistSelector" class="filter-select" onchange="switchPlaylist()" style="margin-bottom: 10px;"></select>
                
                <label style="font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 5px; display: block;">Category</label>
                <select id="categoryFilter" class="filter-select" onchange="filterChannels()"></select>
            </div>
            <ul id="playlist"></ul>
        </aside>
    </div>

    <div id="loginModal" class="modal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">Welcome Back</h2>
            <p style="color: var(--text-dim); margin-bottom: 25px;">Please sign in</p>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button class="btn-primary" onclick="submitLogin()">Sign In</button>
            <p id="loginResult" style="color: #ef4444; font-size: 0.85rem; margin-top: 15px;"></p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
